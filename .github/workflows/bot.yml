name: Borsa Alarm Botu

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1-5"
    - cron: "0 12 * * 1-5"

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Paketleri kur
        run: pip install -r requirements.txt

      - name: Botu çalıştır
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python bot.py
